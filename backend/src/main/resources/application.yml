spring:
  application:
    name: loyalty-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/loyalty}
    username: ${DB_USER:loyalty}
    password: ${DB_PASSWORD:loyalty}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8090}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    enabled: true
  admin:
    email: ${ADMIN_EMAIL:i.belova@loyalty.local}
    password: ${ADMIN_PASSWORD:demo1234}
    name: Ирина Белова
    initials: ИБ
    role: Менеджер программы
    phone: "+375 29 00 00 000"

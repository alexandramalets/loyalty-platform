services:
  postgres:
    image: postgres:16-alpine
    container_name: loyalty-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loyalty}
      POSTGRES_USER: ${POSTGRES_USER:-loyalty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loyalty}
    ports:
      - "5433:5432"
    volumes:
      - loyalty_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loyalty} -d ${POSTGRES_DB:-loyalty}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  loyalty_pg_data:
